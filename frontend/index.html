<!doctype html>
<html lang="en" dir="ltr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RomaERP</title>

      (function () {

      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
