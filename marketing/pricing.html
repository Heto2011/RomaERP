<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الأسعار — RomaERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --ink: #1c2620;
    --ink-soft: #5b6a60;
    --border: #e2ddd0;
    --primary: #0f5c4b;
    --primary-dark: #0a4438;
    --primary-tint: #e6f0ec;
    --accent: #c8862e;
    --accent-tint: #faf1e2;
    --danger: #b3452f;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(28,38,32,.04), 0 12px 32px -16px rgba(28,38,32,.18);
    --hero-bg: #0a0f13;
    --hero-ink: #f4f6f5;
    --hero-ink-soft: rgba(244,246,245,.66);
    --mint: #5fd0a1;
    --sky: #3aa0c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---- Dark hero ---- */
  header.hero-dark {
    background: radial-gradient(120% 90% at 15% -10%, #16222a 0%, var(--hero-bg) 62%);
    color: var(--hero-ink);
    padding: 24px 0 60px;
  }
  .dark-nav {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px; margin-bottom: 52px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 900; font-size: 20px; color: var(--primary-dark);
  }
  .dark-nav .brand { color: #fff; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 900; flex-shrink: 0;
  }
  .nav-links { display: flex; gap: 22px; font-size: 14px; font-weight: 700; flex-wrap: wrap; }
  .nav-links a { color: var(--hero-ink-soft); text-decoration: none; }
  .nav-links a:hover { color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .lang-toggle {
    background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .lang-toggle:hover { border-color: rgba(255,255,255,.4); }

  .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 44px; align-items: center; }
  h1 {
    font-size: clamp(28px, 3.6vw, 42px);
    font-weight: 900;
    margin: 0 0 16px;
    text-wrap: balance;
    color: #fff;
  }
  h1 span { color: var(--mint); }
  .hero-sub { max-width: 480px; color: var(--hero-ink-soft); font-size: 16.5px; margin: 0 0 8px; }
  .hero-cta { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 26px; border-radius: 999px;
    font-weight: 700; font-size: 15px;
    text-decoration: none; cursor: pointer; border: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 10px 24px -10px rgba(15,92,75,.55); }
  .btn-accent { background: var(--accent); color: #2c1c04; box-shadow: 0 10px 24px -10px rgba(200,134,46,.55); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-ghost-dark { background: rgba(255,255,255,.06); color: #fff; border: 1px solid rgba(255,255,255,.2); }

  .hero-trust { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 22px; font-size: 12.5px; color: var(--hero-ink-soft); }
  .hero-trust span { display: inline-flex; align-items: center; gap: 6px; }

  .industries-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .industries-strip span {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 700;
    color: var(--hero-ink-soft);
  }

  /* Device mockup */
  .device-stack { display: flex; align-items: flex-end; justify-content: center; gap: 14px; }
  .laptop { flex: 1; max-width: 480px; background: #1a232c; border-radius: 14px; padding: 10px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.65); }
  .laptop-base { height: 8px; width: 60%; margin: 8px auto 0; background: #232e38; border-radius: 0 0 10px 10px; }
  .laptop-screen { background: #0d1319; border-radius: 8px; overflow: hidden; display: flex; min-height: 340px; }
  .preview-sidebar { width: 160px; flex-shrink: 0; border-inline-end: 1px solid #202a33; padding: 14px 0; display: flex; flex-direction: column; gap: 2px; }
  .preview-sidebar .brand { color: #fff; font-weight: 900; font-size: 14px; padding: 0 16px 14px; margin: 0; }
  .preview-sidebar a { padding: 8px 16px; font-size: 12.5px; color: #8b96a3; }
  .preview-sidebar a.active { background: var(--sky); color: #fff; font-weight: 700; }
  .preview-main { flex: 1; padding: 18px 20px; min-width: 0; color: #e5e9ee; }
  .preview-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .preview-topbar .greeting { font-size: 15px; font-weight: 900; color: #fff; }
  .preview-topbar .bell { width: 26px; height: 26px; border-radius: 50%; background: #161e26; border: 1px solid #232e38; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .preview-main h2 { font-size: 16.5px; font-weight: 900; margin: 0 0 14px; color: #fff; }
  .preview-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .preview-stat { background: #161e26; border: 1px solid #232e38; border-radius: 10px; padding: 10px 12px; }
  .preview-stat .label { font-size: 10.5px; color: #8b96a3; margin-bottom: 5px; }
  .preview-stat .value-row { display: flex; align-items: baseline; gap: 6px; }
  .preview-stat .value { font-size: 16px; font-weight: 900; color: #fff; font-family: "IBM Plex Mono", monospace; }
  .preview-stat .value.up { color: var(--mint); }
  .preview-stat .value.warn { color: #e0a94c; }
  .preview-stat .delta { font-size: 10.5px; font-weight: 700; font-family: "IBM Plex Mono", monospace; }
  .preview-stat .delta.up { color: var(--mint); }
  .preview-stat .delta.down { color: #e0725f; }
  .chart-row { display: flex; align-items: center; gap: 16px; background: #161e26; border: 1px solid #232e38; border-radius: 10px; padding: 12px 14px; }
  .line-chart-block { flex: 1.4; min-width: 0; }
  .line-chart-block .caption { font-size: 10.5px; color: #8b96a3; margin-top: 4px; }
  .donut-block { display: flex; align-items: center; gap: 10px; flex: 1; }
  .donut { width: 78px; height: 78px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: #161e26; }
  .donut-legend { display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: #c7cdd4; }
  .donut-legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-inline-end: 5px; }

  .phone { width: 96px; flex-shrink: 0; background: #1a232c; border-radius: 18px; padding: 8px 6px; box-shadow: 0 30px 70px -28px rgba(0,0,0,.6); }
  .phone-screen { background: #0d1319; border-radius: 12px; padding: 12px 8px; min-height: 190px; }
  .phone-screen .brand { color: #fff; font-weight: 900; font-size: 10px; text-align: center; margin: 0 0 10px; }
  .phone-stat { background: #161e26; border-radius: 8px; padding: 7px 8px; margin-bottom: 6px; }
  .phone-stat .label { font-size: 7.5px; color: #8b96a3; }
  .phone-stat .value { font-size: 11px; font-weight: 900; color: var(--mint); font-family: "IBM Plex Mono", monospace; }
  @media (max-width: 700px) { .phone { display: none; } }

  section { padding: 40px 0; }
  .section-head { text-align: center; max-width: 620px; margin: 0 auto 40px; }
  .section-head .eyebrow {
    color: var(--primary); font-weight: 700; font-size: 13px;
    letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; display: block;
  }
  .section-head h2 { font-size: 28px; margin: 0 0 10px; font-weight: 900; }
  .section-head p { color: var(--ink-soft); margin: 0; }
  .section-head.on-dark h2, .section-head.on-dark .eyebrow { color: #fff; }
  .section-head.on-dark .eyebrow { color: var(--mint); }
  .section-head.on-dark p { color: rgba(255,255,255,.68); }

  /* Feature icon grid */
  .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .icon-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 10px;
  }
  .icon-tile .icon {
    width: 40px; height: 40px; border-radius: 11px; background: var(--primary-tint); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .icon-tile span.label { font-size: 12.5px; font-weight: 700; }

  /* Audiences */
  .audience-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .audience-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 14px; text-align: center; box-shadow: var(--shadow);
  }
  .audience-card .icon { font-size: 26px; margin-bottom: 10px; }
  .audience-card h4 { font-size: 14px; font-weight: 900; margin: 0 0 6px; }
  .audience-card p { font-size: 12px; color: var(--ink-soft); margin: 0; }

  /* AI showcase (dark green) */
  .ai-showcase {
    background: linear-gradient(160deg, #0e2b22 0%, #0a1f19 100%);
    color: #fff; border-radius: 24px; padding: 44px;
  }
  .ai-showcase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .ai-checklist { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 12px; }
  .ai-checklist li { display: flex; gap: 10px; align-items: flex-start; color: rgba(255,255,255,.88); font-size: 14px; }
  .ai-checklist li::before { content: "✓"; color: var(--mint); font-weight: 900; flex-shrink: 0; }
  .chat-mock { background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .chat-bubble { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
  .chat-bubble.user { margin-inline-start: auto; background: rgba(255,255,255,.12); color: #fff; }
  .chat-bubble.bot { margin-inline-end: auto; background: var(--mint); color: #08251a; font-weight: 600; }
  .forecast-card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .forecast-card .title { font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,.8); margin-bottom: 10px; }
  .forecast-bars { display: flex; align-items: flex-end; gap: 10px; height: 60px; }
  .forecast-bars .bar { flex: 1; background: linear-gradient(to top, var(--mint), rgba(95,208,161,.3)); border-radius: 6px 6px 2px 2px; }
  .forecast-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: rgba(255,255,255,.5); margin-top: 6px; }
  .forecast-caption { font-size: 11.5px; color: rgba(255,255,255,.5); margin-top: 8px; }

  .ai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 36px; }
  .ai-card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius); padding: 22px; }
  .ai-card .ai-icon {
    width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,.08); color: var(--mint);
    display: flex; align-items: center; justify-content: center; font-size: 19px; margin-bottom: 12px;
  }
  .ai-card h3 { font-size: 15.5px; font-weight: 900; margin: 0 0 8px; color: #fff; }
  .ai-card p { font-size: 13px; color: rgba(255,255,255,.68); margin: 0; }

  /* Data journey */
  .journey { display: flex; align-items: flex-start; gap: 0; flex-wrap: wrap; justify-content: center; }
  .journey-step { width: 180px; text-align: center; }
  .journey-step .icon {
    width: 54px; height: 54px; border-radius: 50%; background: var(--primary-tint); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 12px;
  }
  .journey-step h4 { font-size: 14px; font-weight: 900; margin: 0 0 6px; }
  .journey-step p { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .journey-arrow { display: flex; align-items: center; justify-content: center; width: 30px; height: 54px; color: var(--border); font-size: 20px; flex-shrink: 0; }
  @media (max-width: 900px) {
    .journey { flex-direction: column; align-items: center; }
    .journey-arrow { transform: rotate(90deg); width: auto; height: 24px; }
  }

  /* Integrations */
  .integrations-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .integration-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; text-align: center; box-shadow: var(--shadow); }
  .integration-card .name { font-weight: 900; font-size: 15px; margin-bottom: 8px; }
  .integration-status { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .integration-status.live { background: #e2f5ec; color: #0f6b45; }
  .integration-status.manual { background: var(--accent-tint); color: #6b4a19; }
  .integrations-note { text-align: center; color: var(--ink-soft); font-size: 13px; max-width: 620px; margin: 20px auto 0; }

  /* Tiers */
  .tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .tier { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
  .tier.is-recommended { border-color: var(--primary); box-shadow: 0 1px 2px rgba(28,38,32,.04), 0 20px 40px -18px rgba(15,92,75,.4); }
  .tier-badge { position: absolute; top: -13px; inset-inline-end: 22px; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
  .tier-badge.is-launch { background: var(--accent); }
  .tier-old-price { text-decoration: line-through; color: var(--ink-soft); font-size: 15px; font-weight: 700; margin-inline-end: 6px; }
  .tier-annual-note { background: var(--accent-tint); color: #6b4a19; border-radius: 8px; font-size: 12.5px; font-weight: 700; padding: 6px 10px; margin: -8px 0 16px; }
  .currency-select { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 28px; }
  .currency-select label { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; }
  .currency-select select { font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .currency-note { text-align: center; font-size: 12px; color: var(--ink-soft); max-width: 480px; margin: -16px auto 32px; }
  .tier-emoji { font-size: 22px; margin-bottom: 10px; }
  .tier-name { font-weight: 900; font-size: 19px; margin: 0 0 4px; }
  .tier-desc { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; min-height: 40px; }
  .tier-price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .tier-price .amount { font-size: 32px; font-weight: 900; }
  .tier-price .currency { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
  .tier-price-note { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 20px; }
  .tier-includes { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .tier-includes li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .tier-includes li::before { content: "✓"; color: var(--primary); font-weight: 900; flex-shrink: 0; }
  .tier .btn { justify-content: center; width: 100%; }

  /* Calculator */
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 36px; display: grid; grid-template-columns: 1fr 320px; gap: 36px; }
  .calc-controls { display: flex; flex-direction: column; gap: 26px; }
  .field-label { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .field-label .val { color: var(--primary); font-family: "IBM Plex Mono", monospace; }
  input[type=range] { width: 100%; height: 6px; border-radius: 999px; background: var(--border); appearance: none; -webkit-appearance: none; }
  input[type=range]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; }
  .field-hint { color: var(--ink-soft); font-size: 12.5px; margin-top: 8px; }
  .calc-result { background: var(--primary-dark); color: #fff; border-radius: 16px; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; }
  .calc-result .tier-tag { align-self: flex-start; background: rgba(255,255,255,.14); font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin-bottom: 18px; }
  .calc-result .price-label { font-size: 13px; opacity: .75; margin-bottom: 6px; }
  .calc-result .price { font-size: 42px; font-weight: 900; font-family: "IBM Plex Mono", monospace; }
  .calc-result .price small { font-size: 15px; opacity: .8; font-family: "Tajawal", sans-serif; font-weight: 700; }
  .calc-result .breakdown { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; opacity: .85; }
  .calc-result .breakdown div { display: flex; justify-content: space-between; }
  .calc-result .btn-primary { margin-top: 20px; background: #fff; color: var(--primary-dark); box-shadow: none; }
  .assumptions-note { margin-top: 18px; padding: 14px 18px; background: var(--accent-tint); border: 1px dashed var(--accent); border-radius: 12px; font-size: 13px; color: #6b4a19; }

  /* FAQ */
  .faq { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .faq details { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px 20px; }
  .faq summary { cursor: pointer; font-weight: 700; font-size: 15px; padding: 16px 0; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-size: 20px; color: var(--primary); flex-shrink: 0; }
  .faq details[open] summary::after { content: "−"; }
  .faq p { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }

  /* Trial */
  .trial-band { background: var(--primary); color: #fff; border-radius: 20px; padding: 44px; text-align: center; }
  .trial-band h2 { font-size: 26px; margin: 0 0 10px; font-weight: 900; }
  .trial-band p { opacity: .9; max-width: 560px; margin: 0 auto 24px; }
  .trial-perks { display: flex; justify-content: center; gap: 28px; margin-top: 30px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
  .trial-perks span { display: inline-flex; align-items: center; gap: 8px; }

  footer { text-align: center; padding: 40px 0 60px; color: var(--ink-soft); font-size: 13px; }

  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-copy { text-align: center; }
    .hero-sub { margin-inline: auto; }
    .hero-cta, .hero-trust, .industries-strip { justify-content: center; }
    .ai-showcase-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .tiers { grid-template-columns: 1fr 1fr; }
    .calc-card { grid-template-columns: 1fr; }
    .icon-grid { grid-template-columns: 1fr 1fr; }
    .ai-grid { grid-template-columns: 1fr; }
    .integrations-grid { grid-template-columns: 1fr 1fr; }
    .preview-stats { grid-template-columns: 1fr; }
    .chart-row { flex-direction: column; align-items: stretch; }
    .audience-grid { grid-template-columns: 1fr 1fr; }
    .laptop-screen { flex-direction: column; }
    .preview-sidebar { display: none; }
  }
  @media (max-width: 540px) {
    .tiers { grid-template-columns: 1fr; }
    .dark-nav { justify-content: center; text-align: center; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<header class="hero-dark">
  <div class="wrap">
    <nav class="dark-nav">
      <div class="brand"><span class="brand-mark">R</span> RomaERP</div>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-right">
        <button class="lang-toggle" id="langToggle" type="button">English</button>
        <a href="/start-trial" class="btn btn-accent" id="navCta"></a>
      </div>
    </nav>

  function convert(sarAmount) {
    const c = CURRENCIES[currentCurrency];
    const value = sarAmount * c.rate;
    return c.decimals > 0 ? value.toFixed(c.decimals) : Math.round(value);
  }

  function renderLineChart() {
    const w = 200, h = 56, pad = 4;
    const max = Math.max(...REVENUE_TREND), min = Math.min(...REVENUE_TREND);
    const points = REVENUE_TREND.map((v, i) => {
      const x = pad + i * ((w - 2 * pad) / (REVENUE_TREND.length - 1));
      const y = h - pad - ((v - min) / (max - min || 1)) * (h - 2 * pad);
      return [x.toFixed(1), y.toFixed(1)];
    });
    const linePoints = points.map(p => p.join(",")).join(" ");
    const areaPoints = `${pad},${h - pad} ` + linePoints + ` ${w - pad},${h - pad}`;
    document.getElementById("lineChart").innerHTML = `
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
        <polygon points="${areaPoints}" fill="rgba(95,208,161,.18)"></polygon>
        <polyline points="${linePoints}" fill="none" stroke="#5fd0a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>`;
  }

  function renderDonut() {
    let cum = 0;

      const start = cum; cum += seg.pct;
      return `${seg.color} ${start}% ${cum}%`;
    }).join(", ");
    document.getElementById("donut").style.background = `conic-gradient(${stops})`;
    const t = T[currentLang];
    document.getElementById("donutLegend").innerHTML = EXPENSE_BREAKDOWN.map((seg, i) =>
      `<div><span class="dot" style="background:${seg.color}"></span>${t.expenseBreakdown[i]}</div>`
    ).join("");
  }

  function pickTier(branches, users) {
    for (const t of TIERS) {
      if (branches <= t.includedBranches && users <= t.includedUsers) return t;
    }
    return TIERS[TIERS.length - 1];
  }

  function computePrice(companies, branches, users) {
    const tier = pickTier(branches, users);
    const extraBranches = tier.custom ? 0 : Math.max(0, branches - tier.includedBranches);
    const extraUsers = tier.custom ? 0 : Math.max(0, users - tier.includedUsers);
    const perCompany = tier.base + extraBranches * EXTRA_BRANCH_PRICE + extraUsers * EXTRA_USER_PRICE;
    const additionalCompanies = Math.max(0, companies - 1);
    const total = perCompany + additionalCompanies * perCompany * ADDITIONAL_COMPANY_DISCOUNT;
    return { tier, perCompany, extraBranches, extraUsers, additionalCompanies, total: Math.round(total) };
  }

    const users = Number(document.getElementById("usersRange").value);
    document.getElementById("companiesVal").textContent = companies;
    document.getElementById("branchesVal").textContent = branches;
    document.getElementById("usersVal").textContent = users;

    const r = computePrice(companies, branches, users);
    document.getElementById("resultTier").textContent = `${r.tier.name} ${r.tier.emoji}`;
    document.getElementById("resultPrice").textContent = convert(r.total).toLocaleString("en-US");
    document.getElementById("resultCurrency").textContent = `${unit} ${t.perMonth}`;

    const lines = [t.baseLine(r.tier.name, convert(r.tier.base), unit)];
    if (r.extraBranches > 0) lines.push(t.extraBranchesLine(r.extraBranches, convert(r.extraBranches * EXTRA_BRANCH_PRICE), unit));
    if (r.extraUsers > 0) lines.push(t.extraUsersLine(r.extraUsers, convert(r.extraUsers * EXTRA_USER_PRICE), unit));
    if (r.additionalCompanies > 0) lines.push(t.additionalCompanyLine(r.additionalCompanies, convert(r.additionalCompanies * r.perCompany * ADDITIONAL_COMPANY_DISCOUNT), unit));
    if (r.tier.custom) lines.push(t.enterpriseContactLine);
    document.getElementById("resultBreakdown").innerHTML = lines.join("");
  }

  function renderCurrencyPicker() {
    const select = document.getElementById("currencyPicker");
    select.innerHTML = Object.entries(CURRENCIES).map(([code, c]) =>
      `<option value="${code}" ${code === currentCurrency ? "selected" : ""}>${c.label[currentLang]}</option>`
    ).join("");
    select.onchange = () => {
      currentCurrency = select.value;
      renderAll();
    };
    renderCurrencyNote();
  }

  function renderCurrencyNote() {
    const t = T[currentLang];
    const note = document.getElementById("currencyNote");
    if (currentCurrency === "SAR") { note.textContent = ""; return; }
    const c = CURRENCIES[currentCurrency];
    note.textContent = c.approx ? t.floatingNote : t.approxNote;
  }

  function renderAll() {
    renderStatic();
    renderTiers();
    renderCurrencyPicker();
    renderCalculator();
  }

  document.getElementById("langToggle").addEventListener("click", () => {
    currentLang = currentLang === "ar" ? "en" : "ar";
    localStorage.setItem("lang", currentLang);
    renderAll();
  });

  renderAll();
  ["companiesRange", "branchesRange", "usersRange"].forEach(id =>
    document.getElementById(id).addEventListener("input", renderCalculator)
  );
</script>
</body>
</html>
