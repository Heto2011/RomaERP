<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الأسعار — RomaERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --ink: #1c2620;
    --ink-soft: #5b6a60;
    --border: #e2ddd0;
    --primary: #0f5c4b;
    --primary-dark: #0a4438;
    --primary-tint: #e6f0ec;
    --accent: #c8862e;
    --accent-tint: #faf1e2;
    --danger: #b3452f;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(28,38,32,.04), 0 12px 32px -16px rgba(28,38,32,.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  header.hero {
    padding: 28px 0 40px;
    text-align: center;
    background:
      radial-gradient(60% 100% at 50% 0%, var(--primary-tint) 0%, transparent 70%);
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 900; font-size: 20px; color: var(--primary-dark);
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 900;
  }
  .lang-toggle {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .lang-toggle:hover { border-color: var(--primary); }
  h1 {
    font-size: clamp(30px, 4.5vw, 46px);
    font-weight: 900;
    margin: 0 0 16px;
    text-wrap: balance;
    color: var(--ink);
  }
  h1 span { color: var(--primary); }
  .hero-sub {
    max-width: 620px; margin: 0 auto;
    color: var(--ink-soft); font-size: 18px;
  }
  .hero-cta {
    margin-top: 32px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 26px; border-radius: 999px;
    font-weight: 700; font-size: 15px;
    text-decoration: none; cursor: pointer; border: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 10px 24px -10px rgba(15,92,75,.55); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }

  section { padding: 40px 0; }
  .section-head { text-align: center; max-width: 620px; margin: 0 auto 40px; }
  .section-head .eyebrow {
    color: var(--primary); font-weight: 700; font-size: 13px;
    letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; display: block;
  }
  .section-head h2 { font-size: 28px; margin: 0 0 10px; font-weight: 900; }
  .section-head p { color: var(--ink-soft); margin: 0; }

  /* Industries strip */
  .industries-strip {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin: 26px auto 0; max-width: 720px;
  }
  .industries-strip span {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 700;
    color: var(--ink-soft);
  }

  /* Product preview (dashboard mockup) */
  .preview-frame {
    max-width: 940px; margin: 0 auto;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(28,38,32,.06), 0 30px 60px -24px rgba(28,38,32,.35);
    border: 1px solid var(--border);
  }
  .preview-chrome {
    background: #e9e5da; padding: 10px 14px;
    display: flex; align-items: center; gap: 7px;
  }
  .preview-chrome span {
    width: 11px; height: 11px; border-radius: 50%; background: #c9c2b2;
  }
  .preview-app {
    background: #14181d; color: #e5e9ee;
    font-family: "Tajawal", sans-serif;
    display: flex;
    min-height: 460px;
  }
  .preview-sidebar {
    width: 190px; flex-shrink: 0;
    background: #14181d; border-inline-start: 1px solid #2c3540;
    padding: 16px 0; display: flex; flex-direction: column; gap: 2px;
  }
  .preview-sidebar .brand {
    color: #fff; font-weight: 900; font-size: 15px;
    padding: 0 18px 16px; margin: 0;
  }
  .preview-sidebar a {
    padding: 9px 18px; font-size: 13.5px; color: #8b96a3;
  }
  .preview-sidebar a.active {
    background: #3aa0c4; color: #fff; font-weight: 700;
  }
  .preview-main { flex: 1; padding: 22px 26px; min-width: 0; }
  .preview-main h2 { font-size: 19px; font-weight: 900; margin: 0 0 18px; color: #fff; }
  .preview-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 22px;
  }
  .preview-stat {
    background: #1c232b; border: 1px solid #2c3540; border-radius: 10px;
    padding: 12px 14px;
  }
  .preview-stat .label { font-size: 11.5px; color: #8b96a3; margin-bottom: 6px; }
  .preview-stat .value { font-size: 19px; font-weight: 900; color: #fff; font-family: "IBM Plex Mono", monospace; }
  .preview-stat .value.up { color: #5fd0a1; }
  .preview-stat .value.warn { color: #e0a94c; }
  .preview-tree { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
  .preview-tree .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .preview-tree .code { color: #6b98a8; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .preview-tree .l0 { font-weight: 700; color: #fff; }
  .preview-tree .l1 { padding-inline-start: 20px; color: #c7cdd4; }
  .preview-tree .l2 { padding-inline-start: 40px; color: #8b96a3; }
  .preview-caption {
    text-align: center; color: var(--ink-soft); font-size: 13.5px;
    max-width: 560px; margin: 18px auto 0;
  }

  /* AI section */
  .ai-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  .ai-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow);
  }
  .ai-card .ai-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--primary-tint); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 14px;
  }
  .ai-card h3 { font-size: 16.5px; font-weight: 900; margin: 0 0 8px; }
  .ai-card p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }
  .ai-card .ai-note {
    display: block; margin-top: 10px; font-size: 12px; font-weight: 700;
    color: var(--primary);
  }

  /* Data journey */
  .journey {
    display: flex; align-items: stretch; gap: 0; flex-wrap: wrap;
    justify-content: center;
  }
  .journey-step {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 16px; width: 220px; text-align: center;
    box-shadow: var(--shadow);
  }
  .journey-step .num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 900; margin: 0 auto 10px;
  }
  .journey-step h4 { font-size: 14px; font-weight: 900; margin: 0 0 6px; }
  .journey-step p { font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .journey-arrow {
    display: flex; align-items: center; justify-content: center;
    width: 36px; color: var(--border); font-size: 20px; flex-shrink: 0;
  }
  @media (max-width: 900px) {
    .journey { flex-direction: column; align-items: center; }
    .journey-arrow { transform: rotate(90deg); width: auto; height: 24px; }
  }

  /* Integrations */
  .integrations-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .integration-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; text-align: center; box-shadow: var(--shadow);
  }
  .integration-card .name { font-weight: 900; font-size: 15px; margin-bottom: 8px; }
  .integration-status {
    display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px;
  }
  .integration-status.live { background: #e2f5ec; color: #0f6b45; }
  .integration-status.manual { background: var(--accent-tint); color: #6b4a19; }
  .integrations-note {
    text-align: center; color: var(--ink-soft); font-size: 13px;
    max-width: 620px; margin: 20px auto 0;
  }

  /* Tiers */
  .tiers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .tier {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 22px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    position: relative;
  }
  .tier.is-recommended {
    border-color: var(--primary);
    box-shadow: 0 1px 2px rgba(28,38,32,.04), 0 20px 40px -18px rgba(15,92,75,.4);
  }
  .tier-badge {
    position: absolute; top: -13px; inset-inline-end: 22px;
    background: var(--primary); color: #fff;
    font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  }
  .tier-badge.is-launch { background: var(--accent); }
  .tier-old-price {
    text-decoration: line-through; color: var(--ink-soft); font-size: 15px; font-weight: 700;
    margin-inline-end: 6px;
  }
  .tier-annual-note {
    background: var(--accent-tint); color: #6b4a19; border-radius: 8px;
    font-size: 12.5px; font-weight: 700; padding: 6px 10px; margin: -8px 0 16px;
  }
  .currency-select {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 0 28px;
  }
  .currency-select label { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; }
  .currency-select select {
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; cursor: pointer;
  }
  .currency-note {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    max-width: 480px; margin: -16px auto 32px;
  }
  .tier-emoji { font-size: 22px; margin-bottom: 10px; }
  .tier-name { font-weight: 900; font-size: 19px; margin: 0 0 4px; }
  .tier-desc { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; min-height: 40px; }
  .tier-price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .tier-price .amount { font-size: 32px; font-weight: 900; }
  .tier-price .currency { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
  .tier-price-note { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 20px; }
  .tier-includes { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .tier-includes li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .tier-includes li::before { content: "✓"; color: var(--primary); font-weight: 900; flex-shrink: 0; }
  .tier .btn { justify-content: center; width: 100%; }

  /* Calculator */
  .calc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 36px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 36px;
  }
  .calc-controls { display: flex; flex-direction: column; gap: 26px; }
  .field-label { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .field-label .val { color: var(--primary); font-family: "IBM Plex Mono", monospace; }
  input[type=range] {
    width: 100%; height: 6px; border-radius: 999px;
    background: var(--border); appearance: none; -webkit-appearance: none;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--primary); border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer;
  }
  .field-hint { color: var(--ink-soft); font-size: 12.5px; margin-top: 8px; }

  .calc-result {
    background: var(--primary-dark);
    color: #fff;
    border-radius: 16px;
    padding: 26px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .calc-result .tier-tag {
    align-self: flex-start;
    background: rgba(255,255,255,.14);
    font-size: 12.5px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px;
    margin-bottom: 18px;
  }
  .calc-result .price-label { font-size: 13px; opacity: .75; margin-bottom: 6px; }
  .calc-result .price { font-size: 42px; font-weight: 900; font-family: "IBM Plex Mono", monospace; }
  .calc-result .price small { font-size: 15px; opacity: .8; font-family: "Tajawal", sans-serif; font-weight: 700; }
  .calc-result .breakdown { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; opacity: .85; }
  .calc-result .breakdown div { display: flex; justify-content: space-between; }
  .calc-result .btn-primary { margin-top: 20px; background: #fff; color: var(--primary-dark); box-shadow: none; }

  .assumptions-note {
    margin-top: 18px; padding: 14px 18px;
    background: var(--accent-tint); border: 1px dashed var(--accent);
    border-radius: 12px; font-size: 13px; color: #6b4a19;
  }

  /* Everything included */
  .included-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .included-grid span {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; font-size: 13.5px; font-weight: 500;
    text-align: center;
  }

  /* FAQ */
  .faq { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .faq details {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 4px 20px;
  }
  .faq summary {
    cursor: pointer; font-weight: 700; font-size: 15px; padding: 16px 0;
    list-style: none; display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-size: 20px; color: var(--primary); flex-shrink: 0; }
  .faq details[open] summary::after { content: "−"; }
  .faq p { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }

  /* Trial */
  .trial-band {
    background: var(--primary); color: #fff;
    border-radius: 20px; padding: 44px; text-align: center;
  }
  .trial-band h2 { font-size: 26px; margin: 0 0 10px; font-weight: 900; }
  .trial-band p { opacity: .9; max-width: 560px; margin: 0 auto 24px; }
  .trial-steps {
    display: flex; justify-content: center; gap: 24px; margin-top: 28px; flex-wrap: wrap;
  }
  .trial-steps div { font-size: 13px; opacity: .85; max-width: 220px; }
  .trial-steps strong { display: block; font-size: 15px; margin-bottom: 4px; }

  footer { text-align: center; padding: 40px 0 60px; color: var(--ink-soft); font-size: 13px; }

  @media (max-width: 860px) {
    .tiers { grid-template-columns: 1fr 1fr; }
    .calc-card { grid-template-columns: 1fr; }
    .included-grid { grid-template-columns: 1fr 1fr; }
    .ai-grid { grid-template-columns: 1fr; }
    .integrations-grid { grid-template-columns: 1fr 1fr; }
    .preview-stats { grid-template-columns: 1fr; }
  }
  @media (max-width: 540px) {
    .tiers { grid-template-columns: 1fr; }
    .top-row { flex-wrap: wrap; gap: 12px; justify-content: center; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span class="brand-mark">R</span> RomaERP</div>
      <button class="lang-toggle" id="langToggle" type="button">English</button>
    </div>
    <h1 id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-cta">
      <a href="/start-trial" class="btn btn-primary" id="heroCtaTrial"></a>
      <a href="#calculator" class="btn btn-ghost" id="heroCtaCalc"></a>
    </div>
    <div class="industries-strip" id="industriesStrip"></div>
  </div>
</header>

<section id="preview">
  <div class="wrap">
    <div class="preview-frame">
      <div class="preview-chrome"><span></span><span></span><span></span></div>
      <div class="preview-app" id="previewApp">
        <div class="preview-sidebar" id="previewSidebar">
          <p class="brand">RomaERP</p>
        </div>
        <div class="preview-main">
          <h2 id="previewTitle"></h2>
          <div class="preview-stats" id="previewStats"></div>
          <div class="preview-tree" id="previewTree"></div>
        </div>
      </div>
    </div>
    <p class="preview-caption" id="previewCaption"></p>
  </div>
</section>

<section id="ai">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="aiEyebrow"></span>
      <h2 id="aiHeading"></h2>
      <p id="aiDesc"></p>
    </div>
    <div class="ai-grid" id="aiGrid"></div>
  </div>
</section>

<section id="journey">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="journeyEyebrow"></span>
      <h2 id="journeyHeading"></h2>
      <p id="journeyDesc"></p>
    </div>
    <div class="journey" id="journeySteps"></div>
  </div>
</section>

<section id="tiers">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="tiersEyebrow"></span>
      <h2 id="tiersHeading"></h2>
      <p id="tiersDesc"></p>
    </div>
    <div class="currency-select">
      <label for="currencyPicker" id="currencyLabel"></label>
      <select id="currencyPicker"></select>
    </div>
    <p class="currency-note" id="currencyNote"></p>
    <div class="tiers" id="tiersGrid"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="includedEyebrow"></span>
      <h2 id="includedHeading"></h2>
      <p id="includedDesc"></p>
    </div>
    <div class="included-grid" id="includedGrid"></div>
  </div>
</section>

<section id="calculator">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="calcEyebrow"></span>
      <h2 id="calcHeading"></h2>
      <p id="calcDesc"></p>
    </div>
    <div class="calc-card">
      <div class="calc-controls">
        <div>
          <div class="field-label"><span id="companiesLabel"></span><span class="val" id="companiesVal">1</span></div>
          <input type="range" id="companiesRange" min="1" max="8" value="1" step="1" />
          <div class="field-hint" id="companiesHint"></div>
        </div>
        <div>
          <div class="field-label"><span id="branchesLabel"></span><span class="val" id="branchesVal">1</span></div>
          <input type="range" id="branchesRange" min="1" max="20" value="1" step="1" />
        </div>
        <div>
          <div class="field-label"><span id="usersLabel"></span><span class="val" id="usersVal">2</span></div>
          <input type="range" id="usersRange" min="1" max="50" value="2" step="1" />
        </div>
      </div>
      <div class="calc-result">
        <div>
          <div class="tier-tag" id="resultTier">Essential 🟢</div>
          <div class="price-label" id="priceLabel"></div>
          <div class="price"><span id="resultPrice">149</span> <small id="resultCurrency"></small></div>
          <div class="breakdown" id="resultBreakdown"></div>
        </div>
        <a href="/start-trial" class="btn btn-primary" id="calcCta"></a>
      </div>
    </div>
    <div class="assumptions-note" id="assumptionsNote"></div>
  </div>
</section>

<section id="integrations">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="integrationsEyebrow"></span>
      <h2 id="integrationsHeading"></h2>
      <p id="integrationsDesc"></p>
    </div>
    <div class="integrations-grid" id="integrationsGrid"></div>
    <p class="integrations-note" id="integrationsNote"></p>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="faqEyebrow"></span>
      <h2 id="faqHeading"></h2>
    </div>
    <div class="faq" id="faqList"></div>
  </div>
</section>

<section id="trial">
  <div class="wrap">
    <div class="trial-band">
      <h2 id="trialHeading"></h2>
      <p id="trialDesc"></p>
      <a href="/start-trial" class="btn btn-primary" style="background:#fff;color:var(--primary-dark)" id="trialCta"></a>
      <div class="trial-steps" id="trialSteps"></div>
    </div>
  </div>

        { name: "Talabat", status: "manual" },
        { name: "Careem", status: "manual" },
      ],
      integrationLiveLabel: "Direct integration", integrationManualLabel: "Settlement-statement matching",
      integrationsNote: "Direct (webhook) integration is live with Jahez and HungerStation — orders arrive automatically. Talabat and Careem don't have a direct integration yet, so you upload the settlement statement the platform exports and the system matches it automatically against your sales. Any other delivery platform not listed here isn't integrated yet.",
      faqEyebrow: "FAQ", faqHeading: "Answers before you have to ask",
      faq: [
        ["Are these prices final?", "No, these are a starting point for our internal review before official launch. They may change, and any existing customer will get advance notice of any change that affects them."],
        ["Can I try it without a credit card?", "Yes, a full 21-day trial with no payment details, and every feature available exactly as in a paid account."],
        ["If I cancel mid-month, do I get a refund?", "The subscription is billed a full month in advance, and there's no partial refund for cancelling mid-period — but you can cancel any time with no commitment beyond a single month."],
        ["My business is contracting, not a restaurant — will this work for me?", "Yes. Accounting, inventory, purchasing, HR, and financial reports all work for any business with multiple branches or sites and multiple users — not just restaurants. The recipes module is restaurant-specific and you simply won't use it if your business is different."],
        ["If I request data deletion, what actually happens?", "Your company's data is genuinely and permanently deleted from the databases — not just a deactivated account. We keep only a confirmation number as proof the request was carried out, with no detailed data about your business."],
      ],
      trialHeading: "Don't take our word for it. Try ROMA yourself.",
      trialDesc: "21 days free, with a real company account and your own data, and every ROMA feature available — no credit card required.",
      trialCta: "Start your trial now",
      trialSteps: [
        ["1. 21 full days", "Every feature, no restrictions"],
        ["2. Seamless conversion", "If you like it, the same account and data continue with nothing lost"],
        ["3. Your data is safe", "Even after the trial ends, your data stays saved — nothing is deleted unless you decide to"],
      ],
      footer: `© RomaERP — Saudi Arabia first. Prices subject to change until official launch. <a href="/terms.html" style="color:var(--primary)">Terms &amp; Privacy</a>`,
      egpNote: "EGP prices are approximate due to exchange-rate fluctuation — the final price is confirmed at activation.",
      approxNote: "Approximate prices converted from Saudi Riyal.",
      langToggleLabel: "عربي",
    },
  };

  function convert(sarAmount) {
    const c = CURRENCIES[currentCurrency];
    const value = sarAmount * c.rate;
    return c.decimals > 0 ? value.toFixed(c.decimals) : Math.round(value);
  }

  function renderStatic() {
    const t = T[currentLang];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
    document.title = t.pageTitle;
    document.getElementById("langToggle").textContent = t.langToggleLabel;

    document.getElementById("heroTitle").innerHTML =
      `${t.heroTitlePrefix}<span>${t.heroTitleHighlight}</span>${t.heroTitleSuffix}`;
    document.getElementById("heroSub").textContent = t.heroSub;
    document.getElementById("heroCtaTrial").textContent = t.heroCtaTrial;
    document.getElementById("heroCtaCalc").textContent = t.heroCtaCalc;
    document.getElementById("industriesStrip").innerHTML =
      t.industries.map(i => `<span>${i}</span>`).join("");

    const sidebar = document.getElementById("previewSidebar");
    sidebar.innerHTML = `<p class="brand">RomaERP</p>` +
      t.previewNav.map((label, i) => `<a class="${i === 2 ? "active" : ""}">${label}</a>`).join("");
    document.getElementById("previewTitle").textContent = t.previewTitle;
    document.getElementById("previewStats").innerHTML = t.previewStats.map(([label, value, cls]) =>
      `<div class="preview-stat"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`
    ).join("");
    document.getElementById("previewTree").innerHTML = t.previewTree.map(([label, code, level]) =>
      `<div class="row ${level}"><span>${label}</span><span class="code">${code}</span></div>`
    ).join("");
    document.getElementById("previewCaption").textContent = t.previewCaption;

    document.getElementById("aiEyebrow").textContent = t.aiEyebrow;
    document.getElementById("aiHeading").textContent = t.aiHeading;
    document.getElementById("aiDesc").textContent = t.aiDesc;
    document.getElementById("aiGrid").innerHTML = t.aiCards.map(c =>
      `<div class="ai-card"><div class="ai-icon">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p></div>`
    ).join("");

    document.getElementById("journeyEyebrow").textContent = t.journeyEyebrow;
    document.getElementById("journeyHeading").textContent = t.journeyHeading;
    document.getElementById("journeyDesc").textContent = t.journeyDesc;
    document.getElementById("journeySteps").innerHTML = t.journeySteps.map(([title, desc], i) => {
      const step = `<div class="journey-step"><div class="num">${i + 1}</div><h4>${title}</h4><p>${desc}</p></div>`;
      return i < t.journeySteps.length - 1 ? step + `<div class="journey-arrow">${currentLang === "ar" ? "←" : "→"}</div>` : step;
    }).join("");

    document.getElementById("tiersEyebrow").textContent = t.tiersEyebrow;
    document.getElementById("tiersHeading").textContent = t.tiersHeading;
    document.getElementById("tiersDesc").textContent = t.tiersDesc;
    document.getElementById("currencyLabel").textContent = t.currencyLabel;

    document.getElementById("includedEyebrow").textContent = t.includedEyebrow;
    document.getElementById("includedHeading").textContent = t.includedHeading;
    document.getElementById("includedDesc").textContent = t.includedDesc;

    document.getElementById("calcEyebrow").textContent = t.calcEyebrow;
    document.getElementById("calcHeading").textContent = t.calcHeading;
    document.getElementById("calcDesc").textContent = t.calcDesc;
    document.getElementById("companiesLabel").textContent = t.companiesLabel;
    document.getElementById("companiesHint").textContent = t.companiesHint;
    document.getElementById("branchesLabel").textContent = t.branchesLabel;
    document.getElementById("usersLabel").textContent = t.usersLabel;
    document.getElementById("priceLabel").textContent = t.priceLabel;
    document.getElementById("calcCta").textContent = t.calcCta;
    document.getElementById("assumptionsNote").innerHTML = t.assumptionsNote;

    document.getElementById("integrationsEyebrow").textContent = t.integrationsEyebrow;
    document.getElementById("integrationsHeading").textContent = t.integrationsHeading;
    document.getElementById("integrationsDesc").textContent = t.integrationsDesc;
    document.getElementById("integrationsGrid").innerHTML = t.integrations.map(i => `
      <div class="integration-card">
        <div class="name">${i.name}</div>
        <span class="integration-status ${i.status}">${i.status === "live" ? t.integrationLiveLabel : t.integrationManualLabel}</span>
      </div>
    `).join("");
    document.getElementById("integrationsNote").textContent = t.integrationsNote;

    document.getElementById("faqEyebrow").textContent = t.faqEyebrow;
    document.getElementById("faqHeading").textContent = t.faqHeading;
    document.getElementById("faqList").innerHTML = t.faq.map(([q, a]) =>
      `<details><summary>${q}</summary><p>${a}</p></details>`
    ).join("");

    document.getElementById("trialHeading").textContent = t.trialHeading;
    document.getElementById("trialDesc").textContent = t.trialDesc;
    document.getElementById("trialCta").textContent = t.trialCta;
    document.getElementById("trialSteps").innerHTML = t.trialSteps.map(([title, desc]) =>
      `<div><strong>${title}</strong>${desc}</div>`
    ).join("");

    document.getElementById("footerText").innerHTML = t.footer;
  }

  function renderTiers() {
    const t = T[currentLang];
    const unit = CURRENCIES[currentCurrency].unit[currentLang];
    const grid = document.getElementById("tiersGrid");
    grid.innerHTML = TIERS.map(tier => {
      const branchWord = tier.includedBranches === 1 ? t.branchWord1 : t.branchWordMany;
      return `
      <div class="tier ${tier.recommended ? "is-recommended" : ""}">
        ${tier.launchOffer ? `<div class="tier-badge is-launch">${t.launchBadge}</div>` : tier.recommended ? `<div class="tier-badge">${t.recommendedBadge}</div>` : ""}
        <div class="tier-emoji">${tier.emoji}</div>
        <h3 class="tier-name">${tier.name}</h3>
        <p class="tier-desc">${tier.desc[currentLang]}</p>
        <div class="tier-price">
          ${tier.listPrice ? `<span class="tier-old-price mono">${convert(tier.listPrice)}</span>` : ""}
          <span class="amount mono">${tier.custom ? t.customPricePrefix + convert(tier.base) : convert(tier.base)}</span>
          <span class="currency">${unit} ${t.perMonth}</span>
        </div>
        <div class="tier-price-note">${tier.custom ? t.customPriceNote : t.includesUpTo(tier.includedBranches, tier.includedUsers, branchWord)}</div>
        ${tier.annualPrice ? `<div class="tier-annual-note">${t.annualNote(convert(tier.annualPrice), unit)}</div>` : ""}
        <ul class="tier-includes">
          <li>${t.includeAllModules}</li>
          <li>${t.includeSupport}</li>
          <li>${tier.custom ? t.includeUnlimited : t.includeExtraPricing}</li>
        </ul>
        <a href="/start-trial" class="btn ${tier.recommended || tier.launchOffer ? "btn-primary" : "btn-ghost"}">${tier.custom ? t.ctaContact : t.ctaStartTrial}</a>
      </div>
    `;
    }).join("");
  }

  function renderIncluded() {
    const t = T[currentLang];
    document.getElementById("includedGrid").innerHTML =
      t.includedFeatures.map(f => `<span>${f}</span>`).join("");
  }

  function pickTier(branches, users) {
    for (const t of TIERS) {
      if (branches <= t.includedBranches && users <= t.includedUsers) return t;
    }
    return TIERS[TIERS.length - 1];
  }

  function computePrice(companies, branches, users) {
    const tier = pickTier(branches, users);
    const extraBranches = tier.custom ? 0 : Math.max(0, branches - tier.includedBranches);
    const extraUsers = tier.custom ? 0 : Math.max(0, users - tier.includedUsers);
    const perCompany = tier.base + extraBranches * EXTRA_BRANCH_PRICE + extraUsers * EXTRA_USER_PRICE;
    const additionalCompanies = Math.max(0, companies - 1);
    const total = perCompany + additionalCompanies * perCompany * ADDITIONAL_COMPANY_DISCOUNT;
    return { tier, perCompany, extraBranches, extraUsers, additionalCompanies, total: Math.round(total) };
  }

  function renderCalculator() {
    const t = T[currentLang];
    const unit = CURRENCIES[currentCurrency].unit[currentLang];
    const companies = Number(document.getElementById("companiesRange").value);
    const branches = Number(document.getElementById("branchesRange").value);
    const users = Number(document.getElementById("usersRange").value);
    document.getElementById("companiesVal").textContent = companies;
    document.getElementById("branchesVal").textContent = branches;
    document.getElementById("usersVal").textContent = users;

    const r = computePrice(companies, branches, users);
    document.getElementById("resultTier").textContent = `${r.tier.name} ${r.tier.emoji}`;
    document.getElementById("resultPrice").textContent = convert(r.total).toLocaleString("en-US");
    document.getElementById("resultCurrency").textContent = `${unit} ${t.perMonth}`;

    const lines = [t.baseLine(r.tier.name, convert(r.tier.base), unit)];
    if (r.extraBranches > 0) lines.push(t.extraBranchesLine(r.extraBranches, convert(r.extraBranches * EXTRA_BRANCH_PRICE), unit));
    if (r.extraUsers > 0) lines.push(t.extraUsersLine(r.extraUsers, convert(r.extraUsers * EXTRA_USER_PRICE), unit));
    if (r.additionalCompanies > 0) lines.push(t.additionalCompanyLine(r.additionalCompanies, convert(r.additionalCompanies * r.perCompany * ADDITIONAL_COMPANY_DISCOUNT), unit));
    if (r.tier.custom) lines.push(t.enterpriseContactLine);
    document.getElementById("resultBreakdown").innerHTML = lines.join("");
  }

  function renderCurrencyPicker() {
    const select = document.getElementById("currencyPicker");
    select.innerHTML = Object.entries(CURRENCIES).map(([code, c]) =>
      `<option value="${code}" ${code === currentCurrency ? "selected" : ""}>${c.label[currentLang]}</option>`
    ).join("");
    select.onchange = () => {
      currentCurrency = select.value;
      renderAll();
    };
    renderCurrencyNote();
  }

  function renderCurrencyNote() {
    const t = T[currentLang];
    const note = document.getElementById("currencyNote");
    if (currentCurrency === "SAR") { note.textContent = ""; return; }
    const c = CURRENCIES[currentCurrency];
    note.textContent = c.approx ? t.egpNote : t.approxNote;
  }

  function renderAll() {
    renderStatic();
    renderTiers();
    renderIncluded();
    renderCurrencyPicker();
    renderCalculator();
  }

  document.getElementById("langToggle").addEventListener("click", () => {
    currentLang = currentLang === "ar" ? "en" : "ar";
    localStorage.setItem("lang", currentLang);
    renderAll();
  });

  renderAll();
  ["companiesRange", "branchesRange", "usersRange"].forEach(id =>
    document.getElementById(id).addEventListener("input", renderCalculator)
  );
</script>
</body>
</html>
