name: Switch SQL Server to Express (production-licensed)

# The production "sqlserver" container runs MSSQL_PID=developer, whose licence is for development/test only.
# Changing MSSQL_PID on a container that already has data does not change the edition, and Microsoft does
# not support downgrading Developer -> Express in place. So this workflow does the supported route: back
# every database up, start a fresh Express container on a NEW volume, restore into it, verify, then swap it
# in under the same name/ports. The old container is kept (stopped) as an instant rollback, and any failure
# after the app is stopped restores the old container and restarts the app automatically.
#
#   mode = inspect  -> read-only report, changes nothing (default; run this first)
#   mode = apply    -> the actual switch (a few minutes of downtime)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = read-only report. apply = back up, migrate to Express, verify, roll back on any failure."
        type: choice
        options:
          - inspect
          - apply
        default: inspect

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: SQL Server Developer -> Express
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: MODE
          command_timeout: 30m
          script: |
            set -eEuo pipefail
            MODE="${MODE:-inspect}"
            OLD=sqlserver
            OLD_KEEP=sqlserver-developer-old
            NEW_TMP=sqlserver-express-new
            NEW_VOL=sqlserver_express_data
            SPEC=/root/sqlserver-container-spec.json
            STAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_DIR=/root/db-backups/express-switch-$STAMP
            STAGE=preflight
            SWAPPED=0
            APP_STOPPED=0

            echo "mode: $MODE"
            docker inspect "$OLD" > "$SPEC"
            chmod 600 "$SPEC"
            ORIG_RESTART=$(python3 -c "import json; print(json.load(open('$SPEC'))[0]['HostConfig']['RestartPolicy']['Name'] or 'no')")

            # Rebuilds the old container's `docker run` from its own inspect data (image pinned by id, same
            # env/ports/network/restart policy/extra mounts) with two deliberate differences: MSSQL_PID=Express,
            # and /var/opt/mssql on a fresh named volume. Modes: "print" (password masked) or "run".
            # portmode "temp" publishes only on 127.0.0.1:14330 so it can run beside the old container.
            cat > /tmp/sql-plan.py <<'PY'
            import json, os, subprocess, sys
            mode, name, volume, portmode = sys.argv[1:5]
            spec = json.load(open('/root/sqlserver-container-spec.json'))[0]
            cfg, host = spec['Config'], spec['HostConfig']
            image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', spec['Image']]))[0]
            image_env = set(image['Config'].get('Env') or [])

            for key in ('Privileged', 'CapAdd', 'CapDrop', 'Devices', 'Links', 'VolumesFrom', 'Tmpfs', 'Sysctls'):
                if host.get(key):
                    sys.exit('unsupported setting on the old container (%s); not guessing: %s' % (key, host.get(key)))

            env = [e for e in (cfg.get('Env') or []) if e not in image_env and not e.startswith('MSSQL_PID=')]
            if not any(e.startswith('MSSQL_SA_PASSWORD=') for e in env):
                sys.exit('MSSQL_SA_PASSWORD not found in the old container environment')
            if 'ACCEPT_EULA=Y' not in env:
                env.append('ACCEPT_EULA=Y')
            env.append('MSSQL_PID=Express')

            args = ['docker', 'run', '-d', '--name', name]
            for e in env:
                args += ['-e', e]

            for m in spec.get('Mounts') or []:
                if m['Destination'] == '/var/opt/mssql':
                    args += ['-v', '%s:/var/opt/mssql' % volume]
                elif m['Type'] == 'bind':
                    args += ['-v', '%s:%s%s' % (m['Source'], m['Destination'], '' if m.get('RW', True) else ':ro')]
                elif m['Type'] == 'volume':
                    args += ['-v', '%s:%s%s' % (m['Name'], m['Destination'], '' if m.get('RW', True) else ':ro')]
            if not any(a == '%s:/var/opt/mssql' % volume for a in args):
                args += ['-v', '%s:/var/opt/mssql' % volume]

            if portmode == 'temp':
                args += ['-p', '127.0.0.1:14330:1433']
            else:
                for cport, binds in (host.get('PortBindings') or {}).items():
                    for b in binds or []:
                        ip = b.get('HostIp') or ''
                        args += ['-p', ('%s:' % ip if ip else '') + '%s:%s' % (b['HostPort'], cport)]

            restart = host.get('RestartPolicy') or {}
            if portmode != 'temp' and restart.get('Name') not in (None, '', 'no'):
                args += ['--restart', restart['Name'] + (':%s' % restart['MaximumRetryCount'] if restart.get('MaximumRetryCount') else '')]
            if host.get('Memory'):
                args += ['--memory', str(host['Memory'])]
            if host.get('NetworkMode') not in (None, '', 'default', 'bridge'):
                args += ['--network', host['NetworkMode']]

            args.append(spec['Image'])
            if mode == 'print':
                print(' '.join('MSSQL_SA_PASSWORD=***' if a.startswith('MSSQL_SA_PASSWORD=') else a for a in args))
            else:
                os.execvp('docker', args)
            PY

            SQLCMD=$(docker exec "$OLD" bash -c 'for p in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do [ -x "$p" ] && echo "$p" && break; done')
            [ -n "$SQLCMD" ] || { echo "sqlcmd not found inside $OLD"; exit 1; }
            PASS=$(docker exec "$OLD" printenv MSSQL_SA_PASSWORD)
            q() { local c=$1; shift; docker exec "$c" "$SQLCMD" -S localhost -U sa -P "$PASS" -C -b -h -1 -W "$@"; }
            wait_ready() {
              for i in $(seq 1 60); do
                if q "$1" -Q "SET NOCOUNT ON; SELECT 1" >/dev/null 2>&1; then return 0; fi
                sleep 3
              done
              echo "$1 did not become ready in time"; return 1
            }

            echo "---- current edition ----"
            q "$OLD" -Q "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('Edition') AS nvarchar(100)) + ' / ' + CAST(SERVERPROPERTY('ProductVersion') AS nvarchar(50))"
            echo "---- databases: name | size MB | state ----"
            q "$OLD" -s "|" -Q "SET NOCOUNT ON; SELECT d.name, CAST(SUM(mf.size)*8/1024 AS int), d.state_desc FROM sys.databases d JOIN sys.master_files mf ON mf.database_id = d.database_id WHERE d.database_id > 4 GROUP BY d.name, d.state_desc ORDER BY d.name"
            DBS=$(q "$OLD" -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE database_id > 4 AND state = 0" | tr -d '\r' | sed '/^\s*$/d')
            echo "---- SQL logins other than sa (restoring would orphan their users) ----"
            OTHER_LOGINS=$(q "$OLD" -Q "SET NOCOUNT ON; SELECT name FROM sys.server_principals WHERE type = 'S' AND name <> 'sa' AND name NOT LIKE '##%'" | tr -d '\r' | sed '/^\s*$/d' || true)
            echo "${OTHER_LOGINS:-none}"
            echo "---- Enterprise-only features in use (Express can't hold these) ----"
            SKU_FEATURES=""
            for DB in $DBS; do
              F=$(q "$OLD" -Q "SET NOCOUNT ON; USE [$DB]; SELECT feature_name FROM sys.dm_db_persisted_sku_features" | tr -d '\r' | sed '/^\s*$/d' || true)
              if [ -n "$F" ]; then SKU_FEATURES="$SKU_FEATURES $DB:$F"; fi
            done
            echo "${SKU_FEATURES:-none}"
            LARGE=$(q "$OLD" -Q "SET NOCOUNT ON; SELECT d.name FROM sys.databases d JOIN sys.master_files mf ON mf.database_id = d.database_id WHERE d.database_id > 4 AND mf.type = 0 GROUP BY d.name HAVING SUM(mf.size)*8/1024 > 9000" | tr -d '\r' | sed '/^\s*$/d')
            echo "---- databases near Express's 10 GB data limit ----"
            echo "${LARGE:-none}"
            echo "---- planned Express container (password masked) ----"
            python3 /tmp/sql-plan.py print "$OLD" "$NEW_VOL" keep
            echo "---- disk ----"
            df -h / | tail -1
            du -sh /root/db-backups 2>/dev/null || true

            if [ -n "$OTHER_LOGINS" ] || [ -n "$SKU_FEATURES" ] || [ -n "$LARGE" ]; then
              echo "BLOCKED: see the lists above; Express switch is not safe as-is."
              if [ "$MODE" = apply ]; then exit 1; fi
            fi
            if [ "$MODE" != apply ]; then
              echo "INSPECT_OK: nothing was changed. Re-run with mode=apply to switch."
              exit 0
            fi

            rollback() {
              trap - ERR
              echo "!! FAILED at stage '$STAGE' — rolling back to the original Developer container"
              docker rm -f "$NEW_TMP" >/dev/null 2>&1 || true
              if [ "$SWAPPED" = 1 ]; then
                docker rm -f "$OLD" >/dev/null 2>&1 || true
                docker rename "$OLD_KEEP" "$OLD" || true
                docker update --restart="$ORIG_RESTART" "$OLD" >/dev/null 2>&1 || true
              fi
              docker start "$OLD" >/dev/null 2>&1 || true
              if [ "$APP_STOPPED" = 1 ]; then systemctl start romaerp-api || true; fi
              echo "ROLLBACK_DONE: original container is running again. Backups are in $BACKUP_DIR"
              exit 1
            }
            trap rollback ERR

            STAGE=stop-app
            systemctl stop romaerp-api
            APP_STOPPED=1

            STAGE=backup
            mkdir -p "$BACKUP_DIR"
            docker exec "$OLD" mkdir -p /var/opt/mssql/backup
            COUNT=0
            for DB in $DBS; do
              echo "backing up $DB"
              q "$OLD" -Q "BACKUP DATABASE [$DB] TO DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH INIT, CHECKSUM"
              q "$OLD" -Q "RESTORE VERIFYONLY FROM DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH CHECKSUM" >/dev/null
              docker cp "$OLD:/var/opt/mssql/backup/${DB}_${STAMP}.bak" "$BACKUP_DIR/"
              [ -s "$BACKUP_DIR/${DB}_${STAMP}.bak" ] || { echo "empty backup for $DB"; false; }
              COUNT=$((COUNT+1))
            done
            echo "backed up and verified $COUNT database(s) into $BACKUP_DIR"

            STAGE=start-express-temp
            docker volume create "$NEW_VOL" >/dev/null
            python3 /tmp/sql-plan.py run "$NEW_TMP" "$NEW_VOL" temp >/dev/null
            wait_ready "$NEW_TMP"
            EDITION=$(q "$NEW_TMP" -Q "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('Edition') AS nvarchar(100))")
            echo "new container edition: $EDITION"
            case "$EDITION" in *Express*) ;; *) echo "new container is not Express"; false;; esac

            STAGE=restore
            docker exec "$NEW_TMP" mkdir -p /var/opt/mssql/backup
            for DB in $DBS; do
              echo "restoring $DB"
              docker cp "$BACKUP_DIR/${DB}_${STAMP}.bak" "$NEW_TMP:/var/opt/mssql/backup/"
              q "$NEW_TMP" -Q "RESTORE DATABASE [$DB] FROM DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH REPLACE, CHECKSUM" >/dev/null
            done
            ONLINE=$(q "$NEW_TMP" -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE database_id > 4 AND state = 0" | tr -d '\r ' )
            echo "databases online in Express: $ONLINE (expected $COUNT)"
            [ "$ONLINE" = "$COUNT" ] || false

            STAGE=swap
            docker stop -t 60 "$OLD" >/dev/null
            docker stop -t 60 "$NEW_TMP" >/dev/null
            docker rm "$NEW_TMP" >/dev/null
            docker rename "$OLD" "$OLD_KEEP"
            SWAPPED=1
            docker update --restart=no "$OLD_KEEP" >/dev/null
            python3 /tmp/sql-plan.py run "$OLD" "$NEW_VOL" keep >/dev/null
            wait_ready "$OLD"
            EDITION=$(q "$OLD" -Q "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('Edition') AS nvarchar(100))")
            case "$EDITION" in *Express*) ;; *) echo "swapped container is not Express: $EDITION"; false;; esac
            ONLINE=$(q "$OLD" -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE database_id > 4 AND state = 0" | tr -d '\r ')
            [ "$ONLINE" = "$COUNT" ] || { echo "only $ONLINE of $COUNT databases online after swap"; false; }

            STAGE=start-app
            systemctl start romaerp-api
            OK=0
            for i in $(seq 1 30); do
              if curl -fsS -m 10 https://romagroup.app/api/health >/dev/null 2>&1; then OK=1; break; fi
              sleep 3
            done
            [ "$OK" = 1 ] || { echo "API health check failed after the switch"; false; }

            trap - ERR
            echo "SWITCH_OK: SQL Server is now '$EDITION' with $ONLINE databases online; the app is healthy."
            echo "The old Developer container is kept stopped as '$OLD_KEEP' (remove it after a few days: docker rm $OLD_KEEP; docker volume ls shows its old data volume)."
