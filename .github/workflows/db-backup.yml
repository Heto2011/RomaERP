name: Nightly Database Backup

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Back up every tenant + central database on the production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR_HOST=/root/db-backups
            RETENTION_DAYS=7
            mkdir -p "$BACKUP_DIR_HOST"

            SQLCMD_BIN=$(docker exec sqlserver bash -c 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi')
            if [ -z "$SQLCMD_BIN" ]; then
              echo "sqlcmd not found inside the sqlserver container"
              exit 1
            fi

            SA_PASS=$(docker exec sqlserver printenv MSSQL_SA_PASSWORD)
            docker exec sqlserver mkdir -p /var/opt/mssql/backup

            DBS=$(docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -h -1 -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE database_id > 4 AND state = 0")

            STAMP=$(date +%Y%m%d_%H%M%S)
            COUNT=0
            for DB in $DBS; do
              DB=$(echo "$DB" | tr -d '\r' | xargs)
              [ -z "$DB" ] && continue
              echo "Backing up $DB..."
              docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -Q "BACKUP DATABASE [$DB] TO DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH INIT"
              docker cp "sqlserver:/var/opt/mssql/backup/${DB}_${STAMP}.bak" "$BACKUP_DIR_HOST/"
              COUNT=$((COUNT+1))
            done

            # Keep only the last week's worth of backups, both the copy on the host and the ones left
            # inside the container's own storage, so this never quietly fills up the disk.
            find "$BACKUP_DIR_HOST" -name "*.bak" -mtime +$RETENTION_DAYS -delete
            docker exec sqlserver bash -c "find /var/opt/mssql/backup -name '*.bak' -mtime +$RETENTION_DAYS -delete"

            # Opt-in: ship tonight's backups off-server to Dropbox, so a total loss of this
            # server (disk failure, droplet deletion) doesn't also take the only backup copy.
            # No-ops harmlessly if the secret isn't set yet.
            DROPBOX_TOKEN=$(printf '%s' "${{ secrets.DROPBOX_ACCESS_TOKEN }}" | tr -d '\r\n')
            if [ -n "$DROPBOX_TOKEN" ]; then
              echo "Shipping tonight's backups off-server to Dropbox..."
              for FILE in "$BACKUP_DIR_HOST"/*_${STAMP}.bak; do
                [ -f "$FILE" ] || continue
                NAME=$(basename "$FILE")
                DBX_ARG=$(python3 -c "import json,sys; print(json.dumps({'path': '/RomaERP-backups/' + sys.argv[1], 'mode': 'add', 'autorename': True, 'mute': True}))" "$NAME")
                curl -s -X POST https://content.dropboxapi.com/2/files/upload \
                  --header "Authorization: Bearer $DROPBOX_TOKEN" \
                  --header "Dropbox-API-Arg: $DBX_ARG" \
                  --header "Content-Type: application/octet-stream" \
                  --data-binary @"$FILE" -o /dev/null -w "  uploaded %{http_code}: $NAME\n"
              done

              DROPBOX_ACCESS_TOKEN="$DROPBOX_TOKEN" RETENTION_DAYS="$RETENTION_DAYS" python3 -c "
            import json, subprocess, datetime, os
            token = os.environ['DROPBOX_ACCESS_TOKEN']
            retention_days = int(os.environ['RETENTION_DAYS'])
            cutoff = datetime.datetime.utcnow() - datetime.timedelta(days=retention_days)
            resp = subprocess.run(['curl', '-s', '-X', 'POST', 'https://api.dropboxapi.com/2/files/list_folder',
                '--header', 'Authorization: Bearer ' + token,
                '--header', 'Content-Type: application/json',
                '--data', json.dumps({'path': '/RomaERP-backups'})], capture_output=True, text=True)
            try:
                data = json.loads(resp.stdout)
            except Exception:
                print('list_folder failed:', resp.stdout[:300])
                data = {}
            for entry in data.get('entries', []):
                ts = entry.get('server_modified')
                if not ts:
                    continue
                modified = datetime.datetime.strptime(ts, '%Y-%m-%dT%H:%M:%SZ')
                if modified < cutoff:
                    subprocess.run(['curl', '-s', '-X', 'POST', 'https://api.dropboxapi.com/2/files/delete_v2',
                        '--header', 'Authorization: Bearer ' + token,
                        '--header', 'Content-Type: application/json',
                        '--data', json.dumps({'path': entry['path_lower']})], capture_output=True, text=True)
                    print('pruned', entry['name'])
            "
            fi

            echo "BACKUP_OK: backed up $COUNT database(s). $(ls -1 "$BACKUP_DIR_HOST" | wc -l) files on disk, $(du -sh "$BACKUP_DIR_HOST" | cut -f1) total."
