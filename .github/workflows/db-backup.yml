name: Nightly Database Backup

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Back up every tenant + central database on the production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR_HOST=/root/db-backups
            RETENTION_DAYS=7
            mkdir -p "$BACKUP_DIR_HOST"

            SQLCMD_BIN=$(docker exec sqlserver bash -c 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi')
            if [ -z "$SQLCMD_BIN" ]; then
              echo "sqlcmd not found inside the sqlserver container"
              exit 1
            fi

            SA_PASS=$(docker exec sqlserver printenv MSSQL_SA_PASSWORD)
            docker exec sqlserver mkdir -p /var/opt/mssql/backup

            DBS=$(docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -h -1 -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE database_id > 4 AND state = 0")

            STAMP=$(date +%Y%m%d_%H%M%S)
            COUNT=0
            for DB in $DBS; do
              DB=$(echo "$DB" | tr -d '\r' | xargs)
              [ -z "$DB" ] && continue
              echo "Backing up $DB..."
              docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -Q "BACKUP DATABASE [$DB] TO DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH INIT"
              docker cp "sqlserver:/var/opt/mssql/backup/${DB}_${STAMP}.bak" "$BACKUP_DIR_HOST/"
              COUNT=$((COUNT+1))
            done

            # Keep only the last week's worth of backups, both the copy on the host and the ones left
            # inside the container's own storage, so this never quietly fills up the disk.
            find "$BACKUP_DIR_HOST" -name "*.bak" -mtime +$RETENTION_DAYS -delete
            docker exec sqlserver bash -c "find /var/opt/mssql/backup -name '*.bak' -mtime +$RETENTION_DAYS -delete"

            echo "BACKUP_OK: backed up $COUNT database(s). $(ls -1 "$BACKUP_DIR_HOST" | wc -l) files on disk, $(du -sh "$BACKUP_DIR_HOST" | cut -f1) total."
