name: Nightly Database Backup

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dropbox_setup:
        description: "One-time: exchange the DROPBOX_AUTH_CODE secret for a long-lived Dropbox refresh token, saved (never printed) on the server. Leave off for a normal backup."
        type: boolean
        default: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Back up every tenant + central database on the production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DROPBOX_SETUP: ${{ inputs.dropbox_setup }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_AUTH_CODE: ${{ secrets.DROPBOX_AUTH_CODE }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DROPBOX_SETUP,DROPBOX_APP_KEY,DROPBOX_APP_SECRET,DROPBOX_AUTH_CODE,BACKUP_ENCRYPTION_KEY
          script: |
            set -e

            # One-time setup: Dropbox no longer issues long-lived access tokens, only short ones that expire
            # after a few hours (which is why off-server uploads were being refused). Instead we keep a
            # refresh token, which does not expire, on the server and mint a fresh access token each night.
            # The token is stored root-only and never printed (this repo's logs are public).
            if [ "${DROPBOX_SETUP:-false}" = true ]; then
              if [ -z "$DROPBOX_APP_KEY" ] || [ -z "$DROPBOX_APP_SECRET" ] || [ -z "$DROPBOX_AUTH_CODE" ]; then
                echo "DROPBOX_SETUP_FAILED: one or more secrets are missing or empty:"
                [ -n "$DROPBOX_APP_KEY" ] && echo "  DROPBOX_APP_KEY: set" || echo "  DROPBOX_APP_KEY: MISSING"
                [ -n "$DROPBOX_APP_SECRET" ] && echo "  DROPBOX_APP_SECRET: set" || echo "  DROPBOX_APP_SECRET: MISSING"
                [ -n "$DROPBOX_AUTH_CODE" ] && echo "  DROPBOX_AUTH_CODE: set" || echo "  DROPBOX_AUTH_CODE: MISSING"
                exit 1
              fi
              RESP=$(curl -s -X POST https://api.dropboxapi.com/oauth2/token -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" \
                -d grant_type=authorization_code --data-urlencode "code=$DROPBOX_AUTH_CODE")
              RT=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('refresh_token',''))" 2>/dev/null || true)
              if [ -z "$RT" ]; then
                echo "DROPBOX_SETUP_FAILED: Dropbox refused the code: $(printf '%s' "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('error_description') or d.get('error') or 'unknown')" 2>/dev/null || echo 'unreadable answer')"
                echo "(the code is single-use and expires within minutes; make a new one and update the DROPBOX_AUTH_CODE secret)"
                exit 1
              fi
              ( umask 077; printf '%s' "$RT" > /root/.dropbox-refresh-token )
              echo "DROPBOX_SETUP_OK: refresh token saved on the server (not shown). Run a normal backup to test the upload."
              exit 0
            fi

            BACKUP_DIR_HOST=/root/db-backups
            RETENTION_DAYS=7
            mkdir -p "$BACKUP_DIR_HOST"

            SQLCMD_BIN=$(docker exec sqlserver bash -c 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi')
            if [ -z "$SQLCMD_BIN" ]; then
              echo "sqlcmd not found inside the sqlserver container"
              exit 1
            fi

            SA_PASS=$(docker exec sqlserver printenv MSSQL_SA_PASSWORD)
            docker exec sqlserver mkdir -p /var/opt/mssql/backup

            DBS=$(docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -h -1 -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE database_id > 4 AND state = 0")

            STAMP=$(date +%Y%m%d_%H%M%S)
            COUNT=0
            for DB in $DBS; do
              DB=$(echo "$DB" | tr -d '\r' | xargs)
              [ -z "$DB" ] && continue
              echo "Backing up $DB..."
              # -b makes sqlcmd exit non-zero on a SQL error, so a failed backup fails the whole job (set -e).
              docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -b -Q "BACKUP DATABASE [$DB] TO DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH INIT, CHECKSUM"
              # A backup nobody has read back is only a hope: prove the file is intact and its checksums match.
              docker exec sqlserver "$SQLCMD_BIN" -S localhost -U sa -P "$SA_PASS" -C -b -Q "RESTORE VERIFYONLY FROM DISK = N'/var/opt/mssql/backup/${DB}_${STAMP}.bak' WITH CHECKSUM" >/dev/null
              docker cp "sqlserver:/var/opt/mssql/backup/${DB}_${STAMP}.bak" "$BACKUP_DIR_HOST/"
              docker exec sqlserver rm -f "/var/opt/mssql/backup/${DB}_${STAMP}.bak"
              [ -s "$BACKUP_DIR_HOST/${DB}_${STAMP}.bak" ] || { echo "empty backup file for $DB"; exit 1; }
              # SQL Server Express cannot compress its own backups, so compress on the host instead.
              gzip -f "$BACKUP_DIR_HOST/${DB}_${STAMP}.bak"
              COUNT=$((COUNT+1))
            done

            # Uploaded files (contract PDFs, face photos, expense proofs) live on disk, not in the databases,
            # so the database backups alone would lose them.
            APPDATA_PARENT=/var/www/romaerp-api
            if [ -d "$APPDATA_PARENT/App_Data" ]; then
              tar -czf "$BACKUP_DIR_HOST/appdata_${STAMP}.tar.gz" -C "$APPDATA_PARENT" App_Data
              echo "Archived uploaded files: $(du -sh "$BACKUP_DIR_HOST/appdata_${STAMP}.tar.gz" | cut -f1)"
            fi

            # Keep only the last week's worth of backups, both the copy on the host and the ones left
            # inside the container's own storage, so this never quietly fills up the disk.
            find "$BACKUP_DIR_HOST" \( -name "*.bak" -o -name "*.bak.gz" -o -name "*.tar.gz" -o -name "*.enc" \) -mtime +$RETENTION_DAYS -delete
            docker exec sqlserver bash -c "find /var/opt/mssql/backup -name '*.bak' -mtime +$RETENTION_DAYS -delete"

            # Opt-in: ship tonight's backups off-server to Dropbox, so a total loss of this
            # server (disk failure, droplet deletion) doesn't also take the only backup copy.
            # No-ops harmlessly if the secret isn't set yet.
            OFFSITE_FAILED=0
            DROPBOX_TOKEN=""
            if [ -s /root/.dropbox-refresh-token ] && [ -n "$DROPBOX_APP_KEY" ] && [ -n "$DROPBOX_APP_SECRET" ]; then
              DROPBOX_TOKEN=$(curl -s -X POST https://api.dropboxapi.com/oauth2/token -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" \
                -d grant_type=refresh_token --data-urlencode "refresh_token=$(cat /root/.dropbox-refresh-token)" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || true)
              if [ -z "$DROPBOX_TOKEN" ]; then
                echo "OFFSITE_FAILED: Dropbox would not issue an access token (refresh token revoked, or app key/secret wrong)"
                OFFSITE_FAILED=1
              fi
            else
              # Legacy: a plain access token secret (these expire after a few hours, so it is only a fallback).
              DROPBOX_TOKEN=$(printf '%s' "${{ secrets.DROPBOX_ACCESS_TOKEN }}" | tr -d '\r\n')
              [ -n "$DROPBOX_TOKEN" ] || echo "Off-server upload is not configured (no Dropbox refresh token on the server)."
            fi
            if [ -n "$DROPBOX_TOKEN" ]; then
              echo "Shipping tonight's backups off-server to Dropbox..."
              if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
                echo "WARNING: BACKUP_ENCRYPTION_KEY secret is not set — the Dropbox copies are NOT encrypted. Add the secret to turn encryption on."
              fi
              for FILE in "$BACKUP_DIR_HOST"/*_${STAMP}.bak.gz "$BACKUP_DIR_HOST"/appdata_${STAMP}.tar.gz; do
                [ -f "$FILE" ] || continue
                UPLOAD="$FILE"
                if [ -n "$BACKUP_ENCRYPTION_KEY" ]; then
                  # AES-256, key stretched with PBKDF2. Restore with:
                  #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in FILE.enc -out FILE -pass pass:KEY
                  openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$FILE" -out "$FILE.enc" -pass env:BACKUP_ENCRYPTION_KEY
                  UPLOAD="$FILE.enc"
                fi
                NAME=$(basename "$UPLOAD")
                DBX_ARG=$(python3 -c "import json,sys; print(json.dumps({'path': '/RomaERP-backups/' + sys.argv[1], 'mode': 'add', 'autorename': True, 'mute': True}))" "$NAME")
                CODE=$(curl -s -X POST https://content.dropboxapi.com/2/files/upload \
                  --header "Authorization: Bearer $DROPBOX_TOKEN" \
                  --header "Dropbox-API-Arg: $DBX_ARG" \
                  --header "Content-Type: application/octet-stream" \
                  --data-binary @"$UPLOAD" -o /dev/null -w "%{http_code}")
                echo "  uploaded $CODE: $NAME"
                if [ "$CODE" != "200" ]; then OFFSITE_FAILED=1; fi
                [ "$UPLOAD" = "$FILE" ] || rm -f "$UPLOAD"
              done

              DROPBOX_ACCESS_TOKEN="$DROPBOX_TOKEN" RETENTION_DAYS="$RETENTION_DAYS" python3 -c "
            import json, subprocess, datetime, os
            token = os.environ['DROPBOX_ACCESS_TOKEN']
            retention_days = int(os.environ['RETENTION_DAYS'])
            cutoff = datetime.datetime.utcnow() - datetime.timedelta(days=retention_days)
            resp = subprocess.run(['curl', '-s', '-X', 'POST', 'https://api.dropboxapi.com/2/files/list_folder',
                '--header', 'Authorization: Bearer ' + token,
                '--header', 'Content-Type: application/json',
                '--data', json.dumps({'path': '/RomaERP-backups'})], capture_output=True, text=True)
            try:
                data = json.loads(resp.stdout)
            except Exception:
                print('list_folder failed:', resp.stdout[:300])
                data = {}
            for entry in data.get('entries', []):
                ts = entry.get('server_modified')
                if not ts:
                    continue
                modified = datetime.datetime.strptime(ts, '%Y-%m-%dT%H:%M:%SZ')
                if modified < cutoff:
                    subprocess.run(['curl', '-s', '-X', 'POST', 'https://api.dropboxapi.com/2/files/delete_v2',
                        '--header', 'Authorization: Bearer ' + token,
                        '--header', 'Content-Type: application/json',
                        '--data', json.dumps({'path': entry['path_lower']})], capture_output=True, text=True)
                    print('pruned', entry['name'])
            "
            fi

            if [ "$OFFSITE_FAILED" = 1 ]; then
              echo "OFFSITE_FAILED: the backups are safe on this server but were NOT copied to Dropbox — fix the Dropbox connection."
              exit 1
            fi
            echo "BACKUP_OK: backed up $COUNT database(s). $(ls -1 "$BACKUP_DIR_HOST" | wc -l) files on disk, $(du -sh "$BACKUP_DIR_HOST" | cut -f1) total."

  alert:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Email the owner that the nightly backup failed
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_TITLE: "Roma backup FAILED"
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "No RESEND_API_KEY secret — cannot email (GitHub's own failure notice still applies)."; exit 0; fi
          python3 - <<'PY' > /tmp/alert.json
          import json, os
          print(json.dumps({
            "from": "Roma Alerts <no-reply@romagroup.app>",
            "to": ["support@romagroup.app"],
            "subject": os.environ["ALERT_TITLE"],
            "text": os.environ["ALERT_TITLE"] + "\n\nThe nightly database backup did not finish. Last night's data may not be protected.\nDetails: " + os.environ["RUN_URL"] + "\n",
          }))
          PY
          curl -s -o /dev/null -w "alert email: HTTP %{http_code}\n" -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @/tmp/alert.json
