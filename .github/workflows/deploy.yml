name: Deploy to Production Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code, rebuild backend + frontend, restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/RomaERP
            git fetch origin
            git checkout claude/project-continuation-gjlk3b
            # The secret-patch steps below edit a tracked file (appsettings.json) directly on the
            # server, which leaves it locally modified after every deploy — reset to match the
            # remote branch exactly before pulling so that never blocks the next deploy's pull.
            # Nothing is lost: the values it discards are re-applied fresh from GitHub secrets below.
            git reset --hard origin/claude/project-continuation-gjlk3b
            git log -1 --oneline

            # SQL Server runs in the "sqlserver" Docker container (confirmed via `docker ps`), not as a
            # native service — its sa password was never covered by any secret-patch step, so an earlier
            # `git reset --hard` here wiped the server's only copy of it (an uncommitted local edit) and
            # broke every DB connection. Recovery: prefer an explicit DB_SA_PASSWORD secret if one is ever
            # set; otherwise recover it straight from the container's own launch config, which still has
            # it (the container itself was never touched, only the app's config file was). The password
            # itself is never echoed anywhere in these logs.
            NEW_DB_PASSWORD="${{ secrets.DB_SA_PASSWORD }}"
            if [ -z "$NEW_DB_PASSWORD" ]; then
              NEW_DB_PASSWORD=$(docker inspect sqlserver --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^MSSQL_SA_PASSWORD=' | cut -d= -f2- || true)
              if [ -n "$NEW_DB_PASSWORD" ]; then
                echo "DB password recovered from the sqlserver container's own launch config"
              fi
            else
              echo "DB password supplied via DB_SA_PASSWORD secret"
            fi
            if [ -n "$NEW_DB_PASSWORD" ]; then
              DB_SA_PASSWORD="$NEW_DB_PASSWORD" python3 -c "
            import json, os
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            pwd = os.environ['DB_SA_PASSWORD']
            data['ConnectionStrings']['Central'] = f'Server=localhost;Database=RomaERP_Central;User Id=sa;Password={pwd};TrustServerCertificate=True;'
            data['ConnectionStrings']['TenantServer'] = f'Server=localhost;User Id=sa;Password={pwd};TrustServerCertificate=True;'
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            "
            else
              echo "WARNING: could not determine the DB sa password (no DB_SA_PASSWORD secret, and docker inspect found nothing) — the API will fail to connect to SQL Server"
            fi

            NEW_SYSTEM_KEY="${{ secrets.SYSTEM_PROVISIONING_KEY }}"
            if [ -n "$NEW_SYSTEM_KEY" ]; then
              SYSTEM_PROVISIONING_KEY="$NEW_SYSTEM_KEY" python3 -c "
            import json, os
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            data.setdefault('System', {})['ProvisioningKey'] = os.environ['SYSTEM_PROVISIONING_KEY'].strip()
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            "
            fi

            NEW_CLAUDE_KEY="${{ secrets.CLAUDE_API_KEY }}"
            if [ -n "$NEW_CLAUDE_KEY" ]; then
              CLAUDE_API_KEY="$NEW_CLAUDE_KEY" python3 -c "
            import json, os
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            data.setdefault('Claude', {})['ApiKey'] = os.environ['CLAUDE_API_KEY'].strip()
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            "
            fi

            NEW_BANK_ACCOUNT_NAME="${{ secrets.BANK_ACCOUNT_NAME }}"
            NEW_BANK_IBAN="${{ secrets.BANK_IBAN }}"
            NEW_BANK_SWIFT="${{ secrets.BANK_SWIFT }}"
            NEW_BANK_NAME="${{ secrets.BANK_NAME }}"
            if [ -n "$NEW_BANK_IBAN" ]; then
              BANK_ACCOUNT_NAME="$NEW_BANK_ACCOUNT_NAME" BANK_IBAN="$NEW_BANK_IBAN" BANK_SWIFT="$NEW_BANK_SWIFT" BANK_NAME="$NEW_BANK_NAME" python3 -c "
            import json, os
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            bank = data.setdefault('BankTransfer', {})
            bank['AccountName'] = os.environ['BANK_ACCOUNT_NAME'].strip()
            bank['Iban'] = os.environ['BANK_IBAN'].strip()
            bank['Swift'] = os.environ['BANK_SWIFT'].strip()
            bank['BankName'] = os.environ['BANK_NAME'].strip()
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            "
            fi

            NEW_INSTAPAY_MOBILE="${{ secrets.INSTAPAY_MOBILE }}"
            if [ -n "$NEW_INSTAPAY_MOBILE" ]; then
              INSTAPAY_MOBILE="$NEW_INSTAPAY_MOBILE" python3 -c "
            import json, os
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            data.setdefault('InstaPay', {})['Mobile'] = os.environ['INSTAPAY_MOBILE'].strip()
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            "
            fi

            # appsettings.json ships a literal placeholder JWT signing key (repo is public, so that
            # placeholder is public too) — every login token is signed with it until this replaces it.
            # Without a real secret here, anyone could forge a valid auth token for any tenant.
            NEW_JWT_KEY="${{ secrets.JWT_SIGNING_KEY }}"
            if [ -n "$NEW_JWT_KEY" ]; then
              JWT_SIGNING_KEY="$NEW_JWT_KEY" python3 -c "
            import json, os
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            data.setdefault('Jwt', {})['Key'] = os.environ['JWT_SIGNING_KEY'].strip()
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            "
            else
              echo "WARNING: JWT_SIGNING_KEY secret not set — the API is signing login tokens with the public placeholder key from the repo. Add the secret to fix this."
            fi

            # Config-completeness check — never prints a value, only whether each key was patched in.
            # Answers "what's configured on the real server right now" without needing to SSH in by hand.
            echo "---- config completeness (values never shown) ----"
            python3 -c "
            import json
            with open('src/RomaERP.API/appsettings.json') as f:
                data = json.load(f)
            def check(label, *path):
                node = data
                for p in path:
                    node = node.get(p, {}) if isinstance(node, dict) else {}
                ok = bool(node) if not isinstance(node, dict) else False
                status = 'SET' if ok else 'MISSING'
                print(status + ': ' + label)
            check('System:ProvisioningKey', 'System', 'ProvisioningKey')
            check('Claude:ApiKey', 'Claude', 'ApiKey')
            check('BankTransfer:Iban', 'BankTransfer', 'Iban')
            check('InstaPay:Mobile', 'InstaPay', 'Mobile')
            jwt_key = data.get('Jwt', {}).get('Key', '')
            is_placeholder = jwt_key == 'CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION_ENV'
            print(('MISSING (still the public placeholder!)' if is_placeholder else 'SET') + ': Jwt:Key')
            "

            dotnet publish src/RomaERP.API/RomaERP.API.csproj -c Release -o /var/www/romaerp-api
            systemctl restart romaerp-api
            sleep 5
            API_STATUS=$(systemctl is-active romaerp-api || true)
            echo "romaerp-api status: $API_STATUS"
            echo "---- romaerp-api status details ----"
            systemctl status romaerp-api --no-pager -l || true
            echo "---- romaerp-api recent logs ----"
            journalctl -u romaerp-api -n 80 --no-pager || true
            if [ "$API_STATUS" != "active" ]; then
              echo "romaerp-api is not active — see logs above for the crash reason"
              exit 1
            fi

            echo "---- live smoke test (localhost) ----"
            LISTEN_URL=$(journalctl -u romaerp-api -n 200 --no-pager | grep -o 'Now listening on: http://[^ ]*' | tail -1 | sed 's/Now listening on: //')
            if [ -n "$LISTEN_URL" ]; then
              echo "Detected listen URL: $LISTEN_URL"
              HEALTH_CODE=000
              for attempt in 1 2 3 4 5; do
                # curl's -w already prints "000" itself when the connection fails (before exiting
                # non-zero) — an earlier version of this also had "|| echo 000" here, which appended a
                # second "000" on failure ("000000"), which (a) never equals the literal "000" the retry
                # check compares against, so it broke out after one attempt instead of retrying, and
                # (b) made a real connection failure look like a malformed response instead.
                HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$LISTEN_URL/api/health" 2>/dev/null)
                HEALTH_CODE=${HEALTH_CODE:-000}
                if [ "$HEALTH_CODE" != "000" ]; then break; fi
                sleep 2
              done
              echo "GET /api/health -> $HEALTH_CODE"
            else
              echo "Could not detect the API's listen URL from recent logs — skipping the localhost smoke test (nginx-proxied requests still work externally regardless)."
            fi

            cd frontend
            npm ci
            npm run build
            rm -rf /var/www/romaerp/*
            cp -r dist/* /var/www/romaerp/
            cp /root/RomaERP/marketing/pricing.html /var/www/romaerp/pricing.html
            cp /root/RomaERP/marketing/terms.html /var/www/romaerp/terms.html
            cp /root/RomaERP/marketing/favicon.svg /var/www/romaerp/favicon.svg
            cp /root/RomaERP/marketing/og-image.png /var/www/romaerp/og-image.png
            cp /root/RomaERP/marketing/roma-group.html /var/www/romaerp/roma-group.html
            cp /root/RomaERP/marketing/roma-hr.html /var/www/romaerp/roma-hr.html

            echo "DEPLOY_OK"
