name: Deploy to Production Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code, rebuild backend + frontend, restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd /root/RomaERP
            git fetch origin
            git checkout claude/project-continuation-gjlk3b
            git pull origin claude/project-continuation-gjlk3b
            git log -1 --oneline

            dotnet publish src/RomaERP.API/RomaERP.API.csproj -c Release -o /var/www/romaerp-api
            systemctl restart romaerp-api
            systemctl is-active romaerp-api

            cd frontend
            npm ci
            npm run build
            rm -rf /var/www/romaerp/*
            cp -r dist/* /var/www/romaerp/

            echo "DEPLOY_OK"

            mkdir -p /root/.ssh
            chmod 700 /root/.ssh
            touch /root/.ssh/authorized_keys
            grep -qxF "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ8Icccz00sKiATDUhsGjIw9Qr1t8SadRPI2q9lbiUOk github-actions-deploy" /root/.ssh/authorized_keys || \
              echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ8Icccz00sKiATDUhsGjIw9Qr1t8SadRPI2q9lbiUOk github-actions-deploy" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys

            sed -i 's/^\(#\s*\)\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null
            sed -i 's/^\(#\s*\)\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null
            systemctl restart ssh
            echo "HARDEN_OK"
