name: Diagnose Database Setup

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect how SQL Server is running on the production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "--- docker ps -a ---"
            docker ps -a 2>&1 || echo "docker not found"
            echo "--- systemctl services matching sql/mssql ---"
            systemctl list-units --type=service --all 2>&1 | grep -i -E "sql|mssql" || echo "none found"
            echo "--- sqlcmd location ---"
            which sqlcmd 2>&1 || echo "sqlcmd not on PATH"
            echo "--- /var/opt/mssql ---"
            ls -la /var/opt/mssql 2>&1 || echo "no /var/opt/mssql"
            echo "--- appsettings connection strings (redacted) ---"
            grep -A2 "ConnectionStrings" /var/www/romaerp-api/appsettings*.json 2>&1 | sed -E 's/(Password=)[^;]+/\1***REDACTED***/g'
            echo "--- disk space ---"
            df -h
            echo "DIAGNOSE_OK"
