name: Server info (read-only)

# Prints which company hosts the server, how big it is and how full it is. It only READS: nothing is installed,
# changed, restarted or deployed. Used to decide when the server needs more memory and what that would cost.
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Read server details
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "== Hosting company (from the server's public address) =="
            IP=$(curl -s --max-time 10 https://ifconfig.me || true)
            echo "public ip: $IP"
            curl -s --max-time 15 "https://ipinfo.io/$IP/json" | grep -E '"(org|city|region|country)"' || true
            echo; echo "== Cloud metadata (if the provider exposes it) =="
            cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null || true
            curl -s --max-time 3 http://169.254.169.254/metadata/v1/id >/dev/null 2>&1 && echo "metadata service present"
            echo; echo "== Where the domain romagroup.app lives (registrar, name servers, mail) =="
            curl -s --max-time 15 "https://rdap.org/domain/romagroup.app" | grep -oE '"(ldhName|handle)":"[^"]*"|"nameserver"|"ldhName":"[^"]*"|"vcardArray":\[[^]]*\]' | head -12 || true
            curl -s --max-time 15 "https://dns.google/resolve?name=romagroup.app&type=NS" | grep -oE '"data":"[^"]*"' || true
            curl -s --max-time 15 "https://dns.google/resolve?name=romagroup.app&type=MX" | grep -oE '"data":"[^"]*"' || echo "no MX records (no mailbox set up on the domain)"
            echo; echo "== System email (Resend): is the key on the server valid, and does a test email go out? =="
            for f in /var/www/romaerp-api/appsettings.json /root/RomaERP/src/RomaERP.API/appsettings.json; do
              [ -f "$f" ] || continue
              KEY=$(python3 -c "import json,sys; print((json.load(open('$f')).get('Resend',{}).get('ApiKey') or '').strip())" 2>/dev/null)
              [ -n "$KEY" ] && { echo "key found in $f (not printed)"; break; }
            done
            if [ -z "$KEY" ]; then
              echo "NO Resend key on the server: system emails (reminders, welcome, password reset) are NOT being sent."
            else
              echo "domains seen by this key:"
              curl -s --max-time 15 -H "Authorization: Bearer $KEY" https://api.resend.com/domains | python3 -c "import sys,json; d=json.load(sys.stdin); print([ (x.get('name'),x.get('status')) for x in d.get('data',[])] if 'data' in d else d)"
              echo "test email result:"
              curl -s --max-time 20 -X POST https://api.resend.com/emails -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                -d '{"from":"Roma Group <no-reply@romagroup.app>","to":["romagroup.support@gmail.com"],"subject":"Roma system email test","html":"<p>If you see this, the system can send email.</p>"}'
              echo
            fi
            unset KEY
            echo; echo "== Size =="
            echo "cpus: $(nproc)"; free -h | sed -n '1,3p'
            df -h / | tail -1
            echo; echo "== How full the server is now =="
            uptime
            ps -eo comm,rss --sort=-rss | head -6
            echo; echo "== Databases on the server =="
            docker ps --format '{{.Names}} {{.Status}}' 2>/dev/null || true
            du -sh /var/opt/mssql 2>/dev/null || docker exec sqlserver du -sh /var/opt/mssql 2>/dev/null || true
