name: Diagnose Claude API Key Config

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Claude:ApiKey is set in production appsettings.json (never prints the value)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/RomaERP
            python3 -c "
            import json
            path = 'src/RomaERP.API/appsettings.json'
            with open(path) as f:
                data = json.load(f)
            claude = data.get('Claude', {})
            key = claude.get('ApiKey', '')
            print('Claude:ApiKey is', 'SET (length ' + str(len(key)) + ')' if key else 'EMPTY/MISSING')
            print('Claude:Model =', claude.get('Model', '(default)'))
            "
