name: Site Uptime Check

# Every 10 minutes: opens ONE GitHub issue (assigned to the owner, so it lands in their inbox) the moment
# romagroup.app stops answering, and closes it by itself when the site is back. One email per outage, not one
# per failed check. Scheduled workflows only run from the default branch (main).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live site
        id: probe
        run: |
          fail=0
          : > "$RUNNER_TEMP/report.txt"
          for path in / /roma-group.html /api/health; do
            code=$(curl -s -o /dev/null -m 20 --retry 2 --retry-delay 5 -w '%{http_code}' "https://romagroup.app$path" || true)
            code=${code:-000}
            echo "- \`$path\` → **$code**" >> "$RUNNER_TEMP/report.txt"
            case "$code" in 2*|3*) ;; *) fail=1 ;; esac
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.txt"

      - name: Open the outage issue (once per outage)
        if: steps.probe.outputs.fail == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.txt`, 'utf8');
            const label = 'site-down';
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205', description: 'Automatic: the live site stopped answering' });
            } catch (e) { /* label already exists */ }
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length > 0) return;   // already reported; don't email again every 10 minutes
            await github.rest.issues.create({
              ...context.repo,
              title: '🚨 الموقع واقع — romagroup.app لا يستجيب',
              labels: [label],
              assignees: [context.repo.owner],
              body: [
                'فحص تلقائي كل ١٠ دقايق لقى إن الموقع أو الخدمة مش بترد.',
                '',
                report,
                `وقت الفحص: ${new Date().toISOString()}`,
                `تفاصيل الفحص: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'المشكلة هتتقفل لوحدها لما الموقع يرجع يشتغل.',
              ].join('\n'),
            });

      - name: Close the outage issue when the site is back
        if: steps.probe.outputs.fail == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'site-down' });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `✅ الموقع رجع يشتغل (${new Date().toISOString()}).` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
