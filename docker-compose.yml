services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/RomaERP.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Central: "Server=sql;Database=RomaERP_Central;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      ConnectionStrings__TenantServer: "Server=sql;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5080:8080"
    depends_on:
      - sql
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:5080/api"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  sql_data:
